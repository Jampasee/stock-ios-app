name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          xcodebuild clean build \
            -project StockApp.xcodeproj \
            -scheme StockApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/StockApp.app Payload/
          zip -r -q StockApp.ipa Payload
          ls -lh StockApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockApp-ipa
          path: StockApp.ipa
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "StockApp iOS IPA (Latest Build)"
          body: "แอป iOS (.ipa) สำหรับ http://stock99.xo.je/projects.html?i=1\nดาวน์โหลดไฟล์ StockApp.ipa ด้านล่างแล้วนำไปติดตั้งผ่าน Sideloadly / TrollStore ได้ทันที"
          files: StockApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
